name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint
      - run: ansible-playbook site.yml --syntax-check

  arch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run playbook twice in an Arch container
        run: tests/run-arch.sh

  fedora:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run playbook twice in a Fedora container
        run: tests/run-fedora.sh

  macos-syntax:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: brew install ansible
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook site.yml --syntax-check
