---
- name: Set up the development environment for the current user
  hosts: localhost
  gather_facts: true
  vars:
    user_home: "{{ ansible_facts['env']['HOME'] }}"
  pre_tasks:
    - name: Fail on unsupported platforms
      ansible.builtin.assert:
        that: >-
          ansible_facts['os_family'] in ['Archlinux', 'Darwin']
          or ansible_facts['distribution'] == 'Fedora'
          or (ansible_facts['distribution'] == 'Ubuntu'
              and ansible_facts['distribution_version'] is version('24.04', '>='))
        fail_msg: "Only Arch Linux, Fedora, Ubuntu 24.04+ and macOS are supported."
      tags: [always]
  roles:
    - role: packages
      tags: [packages]
    - role: shell
      tags: [shell]
    - role: ssh_agent
      tags: [ssh_agent, ssh-agent]
      # Installs the agent when enabled, removes it otherwise (see the role).
      when: ansible_facts['system'] == 'Linux'
    - role: gnome
      tags: [gnome]
      # Opt-in; asking for its tag (--tags gnome) also enables it for that run.
      when: >-
        ansible_facts['system'] == 'Linux'
        and (gnome_enabled | bool or 'gnome' in ansible_run_tags)
    - role: fonts
      tags: [fonts]
    - role: dotfiles
      tags: [dotfiles]
    - role: git
      tags: [git]
    - role: mise
      tags: [mise]
    - role: neovim
      tags: [neovim]
    - role: macspoof
      tags: [macspoof]
      when: macspoof_enabled | bool and ansible_facts['system'] == 'Linux'
    - role: snapper
      tags: [snapper]
      when: snapper_enabled | bool and ansible_facts['system'] == 'Linux'
    - role: framework_charge_limit
      tags: [framework_charge_limit]
      when: framework_charge_limit_enabled | bool and ansible_facts['system'] == 'Linux'
