---
- name: Check whether terra-release is installed
  ansible.builtin.command: rpm -q terra-release
  register: framework_terra_release
  changed_when: false
  failed_when: false

- name: Install terra-release (provides the Terra repository)
  ansible.builtin.command: >-
    dnf install -y --nogpgcheck
    --repofrompath 'terra,{{ terra_release_url }}'
    terra-release
  become: true
  when: framework_terra_release.rc != 0
  changed_when: true

- name: Install framework-system (provides framework_tool)
  ansible.builtin.dnf:
    name: framework-system
    state: present
  become: true

- name: Install charge limit systemd unit
  ansible.builtin.template:
    src: framework-charge-limit.service.j2
    dest: /etc/systemd/system/framework-charge-limit.service
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Flush handlers so the unit is known to systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start the charge limit service
  ansible.builtin.systemd:
    name: framework-charge-limit.service
    enabled: true
    state: started
  become: true
