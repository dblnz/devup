---
- name: Find zsh
  ansible.builtin.command: which zsh
  register: zsh_path
  changed_when: false

- name: Ensure zsh is listed in /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_path.stdout }}"
  become: true
  when: ansible_facts['system'] == 'Linux'

- name: Set zsh as login shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ zsh_path.stdout }}"
  become: true
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['env']['SHELL'] | default('') != zsh_path.stdout
    - not (ci_container | default(false) | bool)

# oh-my-zsh has no release tags, so pin a commit. Its self-updater is disabled
# in zshrc; bump this to update.
- name: Clone oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ user_home }}/.local/share/oh-my-zsh"
    version: 6010fb6260f359e71d99ba25f05f9215809b3ed2

- name: Create zsh history directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/zsh"
    state: directory
    mode: "0755"
