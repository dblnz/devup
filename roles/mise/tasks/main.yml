---
- name: Find tools declared in the global mise config that are not installed
  ansible.builtin.command: mise ls --missing --no-header
  register: mise_missing
  changed_when: false
  environment:
    PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install missing global tools
  ansible.builtin.command: mise install --yes
  changed_when: true
  when: mise_missing.stdout | trim | length > 0
  environment:
    PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
