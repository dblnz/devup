---
- name: Check for an installed ssh-agent user unit
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/systemd/user/ssh-agent.service"
  register: ssh_agent_unit

- name: Stop and disable user ssh-agent
  ansible.builtin.systemd:
    name: ssh-agent.service
    scope: user
    enabled: false
    state: stopped
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  when:
    - ssh_agent_unit.stat.exists
    - not (ci_container | default(false) | bool)

- name: Remove ssh-agent user unit
  ansible.builtin.file:
    path: "{{ user_home }}/.config/systemd/user/ssh-agent.service"
    state: absent
  register: ssh_agent_unit_removed

- name: Reload user systemd after removing the unit
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  when:
    - ssh_agent_unit_removed is changed
    - not (ci_container | default(false) | bool)
