---
# Opt-in; asking for its tag (--tags ssh-agent) also enables it for that run.
# When disabled, a previously installed unit is removed so shells fall back to
# the desktop's agent (the shell rc files key off the unit file's presence).
- name: Install the shared ssh-agent
  ansible.builtin.include_tasks: enable.yml
  when: >-
    ssh_agent_enabled | bool
    or ansible_run_tags | intersect(['ssh_agent', 'ssh-agent']) | length > 0

- name: Remove the shared ssh-agent
  ansible.builtin.include_tasks: disable.yml
  when: >-
    not (ssh_agent_enabled | bool)
    and ansible_run_tags | intersect(['ssh_agent', 'ssh-agent']) | length == 0
