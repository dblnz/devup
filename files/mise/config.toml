# Global tool versions managed by mise. Bump a version, then run:
#   mise install && mise lock
[settings]
lockfile = true
experimental = true

# Use real npm so package postinstall scripts run (the auto-picked aube skips
# them, which leaves claude-code without its native binary).
[settings.npm]
package_manager = "npm"

[tools]
node = "lts"
go = "latest"
python = "3.13"
rust = "1.91.1"
neovim = "0.12.2"
lazygit = "latest"
"npm:@openai/codex" = "0.79.0"
"npm:@github/copilot" = "1.0.61"
