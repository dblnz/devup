# Rust project. System deps (clang, lld, valgrind, pkg-config, openssl, cairo, pango)
# come from the OS package manager.
[env]
RUST_NIGHTLY = "nightly-2025-08-07"

[tools]
rust = { version = "1.91.1", components = "rust-src,clippy,rustfmt", targets = "x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-unknown-none,wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown" }
just = "latest"
jq = "latest"
