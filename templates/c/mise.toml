# C/C++ project. Compilers and libs come from the OS package manager:
#   Arch:  pacman -S base-devel clang ninja meson ccache gdb lldb valgrind pkg-config
#   Fedora: dnf install gcc gcc-c++ make clang ninja-build meson ccache gdb lldb valgrind pkgconf-pkg-config
#   macOS: brew install llvm ninja meson ccache pkg-config
[tools]
cmake = "latest"
